<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Calculator</title>
<meta name="description" content="FastAPI + JWT + SQLAlchemy calculator with per-user history. Web client for the Smart Calculator API.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e3e6eb;
    --accent: #2a63d6; --accent-ink: #ffffff; --err: #c0362c; --ok: #1a7f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1a1d23; --ink: #eef0f3; --muted: #9aa2ae; --line: #2b3039;
            --accent: #5b8cf0; --accent-ink: #0d0f12; --err: #f07b70; --ok: #5cc795; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .links a { color: var(--accent); margin-left: 14px; font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { background: none; border: 1px solid var(--line); color: var(--muted); }
  .tab[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }
  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 12px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; font: inherit; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.secondary { background: none; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
  .row { display: flex; gap: 8px; }
  .row input { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .result { font: 600 2rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 16px 0 0; min-height: 2.4rem; }
  .msg { min-height: 1.4rem; font-size: .95rem; margin: 8px 0 0; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
  th.num { text-align: right; }
  .empty { color: var(--muted); }
  .note { color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Smart Calculator</h1>
    <nav class="links"><a href="/docs">API docs</a><a href="https://github.com/NusratBegum/smart-calculator">Source</a></nav>
  </header>
  <p class="sub">FastAPI · JWT auth · SQLAlchemy · safe AST evaluation · per-user history</p>

  <section class="card" id="auth">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-login" aria-selected="true">Log in</button>
      <button class="tab" role="tab" id="tab-register" aria-selected="false">Register</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" required minlength="3" maxlength="50" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password">
      <button type="submit" id="auth-submit">Log in</button>
      <p class="msg" id="auth-msg" role="status"></p>
    </form>
    <p class="note">Demo instance: accounts and history may be reset when the server restarts.</p>
  </section>

  <section class="card" id="calc" hidden>
    <div class="bar"><span>Signed in as <b id="who"></b></span><button class="secondary" id="logout">Log out</button></div>
    <form id="calc-form" class="row">
      <input id="expression" aria-label="Expression" placeholder="(2 + 3) * 4 / 5" required maxlength="100" autocomplete="off">
      <button type="submit">=</button>
    </form>
    <p class="result" id="result" aria-live="polite"></p>
    <p class="msg" id="calc-msg" role="status"></p>
  </section>

  <section class="card" id="history" hidden>
    <div class="bar"><b>History</b><span class="note">only you can see this</span></div>
    <table>
      <thead><tr><th>Expression</th><th class="num">Result</th><th>When</th></tr></thead>
      <tbody id="history-rows"></tbody>
    </table>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'login';
  const store = {
    get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
    clear: () => { try { sessionStorage.clear(); } catch {} },
  };

  async function api(path, { method = 'GET', body, auth = true } = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const token = store.get('token');
    if (auth && token) headers.Authorization = `Bearer ${token}`;
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && auth) { signOut(); throw new Error('Session expired, please log in again.'); }
    if (!res.ok) {
      const d = data.detail;
      throw new Error(Array.isArray(d) ? d.map((e) => e.msg).join('; ') : d || `Request failed (${res.status})`);
    }
    return data;
  }

  function setMode(next) {
    mode = next;
    $('tab-login').setAttribute('aria-selected', String(mode === 'login'));
    $('tab-register').setAttribute('aria-selected', String(mode === 'register'));
    $('auth-submit').textContent = mode === 'login' ? 'Log in' : 'Create account';
    $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    $('auth-msg').textContent = '';
  }
  $('tab-login').onclick = () => setMode('login');
  $('tab-register').onclick = () => setMode('register');

  function showApp(signedIn) {
    $('auth').hidden = signedIn;
    $('calc').hidden = !signedIn;
    $('history').hidden = !signedIn;
    if (signedIn) { $('who').textContent = store.get('user'); loadHistory(); $('expression').focus(); }
  }
  function signOut() { store.clear(); showApp(false); }
  $('logout').onclick = signOut;

  $('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('auth-msg');
    const creds = { username: $('username').value.trim(), password: $('password').value };
    msg.className = 'msg'; msg.textContent = '…';
    try {
      if (mode === 'register') await api('/register', { method: 'POST', body: creds, auth: false });
      const { access_token } = await api('/login', { method: 'POST', body: creds, auth: false });
      store.set('token', access_token); store.set('user', creds.username);
      $('password').value = ''; msg.textContent = '';
      showApp(true);
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
  };

  $('calc-form').onsubmit = async (e) => {
    e.preventDefault();
    const msg = $('calc-msg');
    msg.className = 'msg'; msg.textContent = '';
    try {
      const { result } = await api('/calculate', { method: 'POST', body: { expression: $('expression').value } });
      $('result').textContent = `= ${Number.isInteger(result) ? result : +result.toPrecision(12)}`;
      loadHistory();
    } catch (err) { $('result').textContent = ''; msg.className = 'msg err'; msg.textContent = err.message; }
  };

  async function loadHistory() {
    const tbody = $('history-rows');
    try {
      const rows = await api('/history');
      tbody.replaceChildren(...(rows.length ? rows.map((r) => {
        const tr = document.createElement('tr');
        const when = new Date(r.created_at.endsWith('Z') ? r.created_at : r.created_at + 'Z');
        [[r.expression], [+r.result.toPrecision(12), 'num'], [when.toLocaleString()]].forEach(([text, cls]) => {
          const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.append(td);
        });
        return tr;
      }) : [Object.assign(document.createElement('tr'), { innerHTML: '<td colspan="3" class="empty">No calculations yet.</td>' })]));
    } catch (err) { $('calc-msg').className = 'msg err'; $('calc-msg').textContent = err.message; }
  }

  showApp(Boolean(store.get('token')));
</script>
</body>
</html>
